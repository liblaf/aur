#:schema https://mise.jdx.dev/schema/mise.json

[tasks.default]
description = "List available maintenance tasks"
run = "mise tasks --no-global"

[tasks.test]
description = "Run shared and package regression checks"
run = "python3 scripts/aur.py test"

[tasks.check]
description = "Check upstream releases, AUR synchronization, and validation age"
usage = 'arg "<package>"'
run = 'python3 scripts/aur.py check "${usage_package:?}"'

[tasks.update]
description = "Download and validate upstream assets, then regenerate package metadata"
usage = 'arg "<package>"'
run = 'python3 scripts/aur.py update "${usage_package:?}"'

[tasks.build]
description = "Build the current recipe with devtools in a clean Arch chroot"
usage = 'arg "<package>"'
run = 'python3 scripts/aur.py build "${usage_package:?}" --output ".artifacts/${usage_package:?}"'

[tasks.lint]
description = "Check recipes, shell scripts, and workflows with namcap, ShellCheck, and actionlint"
run = 'python3 scripts/aur.py lint'

[tasks.smoke]
description = "Install and exercise the existing clean-build artifacts"
usage = 'arg "<package>"'
run = 'python3 scripts/aur.py smoke "${usage_package:?}" --artifacts ".artifacts/${usage_package:?}"'

[tasks.validate]
description = "Update, clean-build, lint, and exercise a package in disposable Arch Linux"
usage = 'arg "<package>"'
run = 'python3 scripts/aur.py validate "${usage_package:?}" --candidate ".candidates/${usage_package:?}"'

[tasks.publish]
description = "Run the complete shared publishing workflow on GitHub"
run = "gh workflow run packages.yml --repo liblaf/aur -f validate_current=true"
