#:schema https://mise.jdx.dev/schema/mise.json

[tools]
"aqua:rhysd/actionlint" = "latest"
shellcheck = "latest"

[tasks.update]
description = "Check upstream and update PKGBUILD/.SRCINFO (all packages by default)"
usage = 'arg "[package]" var=#true'
run = 'python3 scripts/update.py ${usage_package:-}'

[tasks.srcinfo]
description = "Regenerate .SRCINFO for every package"
run = 'for dir in packages/*/; do (cd "$dir" && makepkg --printsrcinfo > .SRCINFO); done'

[tasks.lint]
description = "Lint recipes, scripts, and workflows"
run = '''
set -e
for dir in packages/*/; do
  (cd "$dir" && makepkg --printsrcinfo | diff -u .SRCINFO -)
  if command -v namcap > /dev/null; then namcap "$dir/PKGBUILD"; fi
done
shellcheck --shell=bash --exclude=SC2034,SC2154 packages/*/PKGBUILD
shellcheck scripts/*.sh
actionlint
'''

[tasks.build]
description = "Build and smoke-test a package in a disposable Arch Linux container"
usage = 'arg "<package>"'
run = '''
sources="${XDG_CACHE_HOME:-$HOME/.cache}/aur-sources"
mkdir -p "$sources"
docker run --rm -v "$PWD:/repo:ro" -v "$sources:/sources" -w /repo -e PACKAGE="${usage_package:?}" \
  archlinux:base-devel bash -euo pipefail -c '
  pacman -Syu --noconfirm --needed namcap >/dev/null
  useradd --create-home builder
  echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
  install -d -o builder /home/builder/out && chown builder /sources
  cp -r "packages/$PACKAGE" /home/builder/recipe && chown -R builder: /home/builder/recipe
  cd /home/builder/recipe
  sudo -u builder env SRCDEST=/sources PKGDEST=/home/builder/out makepkg --syncdeps --noconfirm --cleanbuild
  cd /repo
  pacman -U --noconfirm /home/builder/out/*.pkg.tar.zst
  # pydepends misreads bundled interpreters (Faceform Wrap ships Python 3.8).
  namcap -e pydepends /home/builder/out/*.pkg.tar.zst | tee /tmp/namcap.log
  if grep " E: " /tmp/namcap.log; then exit 1; fi
  bash scripts/smoke.sh "$PACKAGE"
'
'''

[tasks.publish]
description = "Run the GitHub workflow: check upstream, build, test, and publish"
run = "gh workflow run aur.yml --repo liblaf/aur"
