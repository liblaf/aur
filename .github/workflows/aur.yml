name: AUR

on:
  schedule:
    - cron: '17 3 * * *' # daily, 11:17 Asia/Shanghai
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: aur-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.package }})
    strategy:
      fail-fast: false
      matrix:
        package: [faceform-wrap, manggo, mihomo-smart-bin]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 60
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - name: Prepare Arch Linux
        run: |
          pacman -Syu --noconfirm --needed git namcap pacman-contrib python shellcheck
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          install -d -o builder -g builder /tmp/build /tmp/out /tmp/src
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Hand the checkout to the build user
        run: chown -R builder:builder .
      - name: Check upstream for a new release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sudo -u builder --preserve-env=GH_TOKEN python3 scripts/update.py "$PACKAGE"
      - name: Lint the recipe
        working-directory: packages/${{ matrix.package }}
        run: |
          sudo -u builder makepkg --printsrcinfo | diff -u .SRCINFO -
          namcap PKGBUILD
          shellcheck --shell=bash --exclude=SC2034,SC2154 PKGBUILD
      - name: Build in a clean environment
        working-directory: packages/${{ matrix.package }}
        run: |
          sudo -u builder env BUILDDIR=/tmp/build PKGDEST=/tmp/out SRCDEST=/tmp/src \
            makepkg --syncdeps --noconfirm --cleanbuild
          rm -rf /tmp/build /tmp/src
      - name: Install and test
        run: |
          pacman -U --noconfirm /tmp/out/*.pkg.tar.zst
          # pydepends misreads bundled interpreters (Faceform Wrap ships Python 3.8).
          namcap -e pydepends /tmp/out/*.pkg.tar.zst | tee /tmp/namcap.log
          if grep " E: " /tmp/namcap.log; then exit 1; fi
          bash scripts/smoke.sh "$PACKAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.package }}
          path: packages/${{ matrix.package }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    # Release every package that built and tested, even if another one failed.
    if: >-
      always() && github.repository == 'liblaf/aur' && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    container: archlinux:base
    environment: aur-publish
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Prepare Arch Linux
        run: pacman -Syu --noconfirm --needed git github-cli openssh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: ${{ runner.temp }}/packages
      - name: Apply tested package files
        id: packages
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          shopt -s nullglob
          names=()
          for artifact in "$RUNNER_TEMP"/packages/package-*; do
            name=${artifact##*/package-}
            cp -a "$artifact/." "packages/$name/"
            names+=("$name")
          done
          echo "names=${names[*]}" >> "$GITHUB_OUTPUT"
          {
            echo 'files<<EOF'
            git status --porcelain -- packages | cut -c4-
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Publish to the AUR
        if: vars.AUR_PUBLISH_ENABLED == 'true' && steps.packages.outputs.names != ''
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          NAMES: ${{ steps.packages.outputs.names }}
        run: |
          umask 077
          key="$RUNNER_TEMP/aur-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$key"
          export GIT_SSH_COMMAND="ssh -F /dev/null -i $key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/.config/aur-known-hosts"
          failed=0
          for name in $NAMES; do
            bash scripts/publish.sh "$name" || failed=1
          done
          exit "$failed"
      # main requires signed commits, so commit through the GitHub API on a
      # temporary branch and fast-forward main only if it has not moved.
      - name: Create a temporary branch
        if: steps.packages.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/heads/aur-update/$GITHUB_RUN_ID" -f "sha=$GITHUB_SHA" > /dev/null
      - name: Commit updated packages
        if: steps.packages.outputs.files != ''
        id: commit
        uses: suzuki-shunsuke/commit-action@5eaa5ecce3ffe93d09a85b946dc5136e3713b1b7 # v1.1.0
        with:
          branch: aur-update/${{ github.run_id }}
          commit_message: 'chore: update AUR packages [skip ci]'
          files: ${{ steps.packages.outputs.files }}
      - name: Fast-forward main
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" \
            -f "sha=$COMMIT_SHA" -F force=false > /dev/null
      - name: Delete the temporary branch
        if: always() && steps.packages.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/aur-update/$GITHUB_RUN_ID" || true
